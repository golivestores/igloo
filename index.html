<script>
(function(){
  var logs = [];
  var panel = null;

  function getPanel() {
    if (panel) return panel;
    panel = document.createElement('div');
    panel.style.cssText = [
      'position:fixed','top:0','left:0','right:0','bottom:0',
      'background:rgba(0,0,0,0.85)','color:#0f0','font:12px/1.5 monospace',
      'padding:10px','overflow-y:auto','z-index:999999',
      'white-space:pre-wrap','word-break:break-all'
    ].join(';');
    document.body.appendChild(panel);
    renderPanel();
    return panel;
  }

  function renderPanel() {
    if (!panel) return;
    panel.textContent = '=== DEBUG (tap to hide) ===\n' + logs.join('\n');
  }

  function log(type, msg) {
    var line = '[' + type + '] ' + msg;
    logs.push(line);
    if (logs.length > 200) logs.shift();
    renderPanel();
  }

  // 全局 JS 错误
  window.addEventListener('error', function(e) {
    if (e.filename) {
      log('JS', e.message + '\n  at ' + e.filename.split('/').pop() + ':' + e.lineno);
    } else if (e.target && e.target.src) {
      log('LOAD_FAIL', e.target.src.replace(location.origin,''));
    } else if (e.target && e.target.href) {
      log('LOAD_FAIL', e.target.href.replace(location.origin,''));
    }
  }, true);

  // Promise rejection
  window.addEventListener('unhandledrejection', function(e) {
    var msg = e.reason ? (e.reason.message || String(e.reason)) : 'unknown';
    log('PROMISE', msg);
  });

  // 能力检测
  window.addEventListener('DOMContentLoaded', function() {
    log('UA', navigator.userAgent);
    log('WebGL', (function(){
      try {
        var c = document.createElement('canvas');
        return !!c.getContext('webgl2') ? 'WebGL2 OK' :
               !!c.getContext('webgl') ? 'WebGL1 only' : 'NO WebGL';
      } catch(e) { return 'ERROR: ' + e.message; }
    })());
    log('SAB', typeof SharedArrayBuffer !== 'undefined' ? 'SharedArrayBuffer OK' : 'NO SharedArrayBuffer');
    log('Worker', typeof Worker !== 'undefined' ? 'Worker OK' : 'NO Worker');
    log('WASM', typeof WebAssembly !== 'undefined' ? 'WASM OK' : 'NO WASM');

    // 显示面板（初始化时先显示）
    getPanel();

    // 点击隐藏/显示
    panel.addEventListener('click', function() {
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    });
  });

  // vite:preloadError
  window.addEventListener('vite:preloadError', function(e) {
    log('VITE', 'preloadError: ' + (e.payload && e.payload.message || e.detail || '?'));
  });

  window._dbg = { log: log, show: function(){ getPanel(); panel.style.display='block'; } };
})();
</script>
