<script>
(function(){
  var logs = [];

  function showPanel() {
    var existing = document.getElementById('_dbg_panel');
    if (existing) { existing.style.display = 'block'; return existing; }
    var p = document.createElement('div');
    p.id = '_dbg_panel';
    // Use a shadow host to escape all stacking contexts
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:2147483647;pointer-events:auto';
    var shadow = host.attachShadow({mode:'open'});
    var style = document.createElement('style');
    style.textContent = 'div{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);color:#0f0;font:11px/1.5 monospace;padding:8px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}';
    shadow.appendChild(style);
    shadow.appendChild(p);
    host.addEventListener('click', function(){ host.style.display = host.style.display==='none'?'block':'none'; });
    document.documentElement.appendChild(host);
    return p;
  }

  function render() {
    var p = document.getElementById('_dbg_panel');
    if (!p) p = showPanel();
    p.textContent = '=== DEBUG (tap to hide) ===\n' + logs.join('\n');
  }

  function log(type, msg) {
    var ts = ((Date.now() % 100000) / 1000).toFixed(1);
    logs.push('[' + ts + 's][' + type + '] ' + msg);
    if (logs.length > 300) logs.shift();
    render();
  }

  // JS errors
  window.addEventListener('error', function(e) {
    if (e.message) log('JS_ERR', e.message + (e.filename ? '\n  '+e.filename.split('/').pop()+':'+e.lineno : ''));
    else if (e.target && (e.target.src || e.target.href)) log('LOAD_FAIL', (e.target.src||e.target.href).replace(location.origin,''));
  }, true);

  window.addEventListener('unhandledrejection', function(e) {
    log('REJECT', e.reason ? (e.reason.message || String(e.reason)) : '?');
  });

  // Intercept fetch to log all network requests
  var origFetch = window.fetch;
  window.fetch = function(input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || String(input);
    var short = url.replace(/https?:\/\/[^\/]+/,'').replace(/\?.*$/,'');
    log('FETCH>', short);
    var start = Date.now();
    return origFetch.apply(this, arguments).then(function(res) {
      log('FETCH' + (res.ok?'OK':'ERR'), short + ' ' + res.status + ' (' + (Date.now()-start) + 'ms)');
      return res;
    }, function(err) {
      log('FETCH_FAIL', short + ' ' + err.message);
      throw err;
    });
  };

  // Intercept XHR too
  var origOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function(method, url) {
    this._dbgUrl = String(url).replace(/https?:\/\/[^\/]+/,'').replace(/\?.*$/,'');
    log('XHR>', this._dbgUrl);
    return origOpen.apply(this, arguments);
  };
  var origSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.send = function() {
    var self = this;
    var start = Date.now();
    this.addEventListener('load', function(){ log('XHR_OK', self._dbgUrl + ' ' + self.status + ' (' + (Date.now()-start) + 'ms)'); });
    this.addEventListener('error', function(){ log('XHR_FAIL', self._dbgUrl); });
    return origSend.apply(this, arguments);
  };

  // Capability checks - run immediately
  log('UA', navigator.userAgent.replace(/.*Chrome\//,'Chrome/').split(' ')[0]);
  log('WebGL', (function(){
    try { var c=document.createElement('canvas'); return c.getContext('webgl2')?'WebGL2':c.getContext('webgl')?'WebGL1':'NONE'; }
    catch(e){ return 'ERR:'+e.message; }
  })());
  log('SAB', typeof SharedArrayBuffer!=='undefined'?'OK':'MISSING');
  log('Worker', typeof Worker!=='undefined'?'OK':'MISSING');
  log('WASM', typeof WebAssembly!=='undefined'?'OK':'MISSING');

  // Show panel after 1s (after app initializes its DOM)
  setTimeout(function(){ showPanel(); render(); }, 1000);

  // Also show after 5s and 15s in case it was hidden
  setTimeout(function(){
    var h = document.querySelector('div[style*="2147483647"]');
    if(h) h.style.display='block';
  }, 5000);

  window._dbg = { log: log };
})();
</script>
